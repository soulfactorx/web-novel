<!doctype html>
<html lang="ko" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, noarchive">
<meta name="generator" content="web-novel standalone">
<title><!--WN_TITLE--></title>
<style>
:root {
  --bg: #fbfbf8; --fg: #222; --muted: #777; --line: #e2e2dc; --panel: #fff; --accent: #2f6fdd; --hover: rgba(0,0,0,.05);
  --font-size: 18px; --line-height: 1.8; --width: 720px;
  --reader-font: "Noto Serif KR", "Nanum Myeongjo", "Batang", serif;
}
:root[data-theme="sepia"] { --bg: #f4ecd8; --fg: #3b3024; --muted: #8a7a63; --line: #e0d5bb; --panel: #faf4e4; --hover: rgba(80,60,20,.07); }
:root[data-theme="dark"] { --bg: #17181a; --fg: #d6d6d2; --muted: #8b8d91; --line: #2c2e31; --panel: #202225; --accent: #7aa7ff; --hover: rgba(255,255,255,.06); }
@media (prefers-color-scheme: dark) {
  :root[data-theme="auto"] { --bg: #17181a; --fg: #d6d6d2; --muted: #8b8d91; --line: #2c2e31; --panel: #202225; --accent: #7aa7ff; --hover: rgba(255,255,255,.06); }
}
:root[data-font="sans"] { --reader-font: "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  padding: 0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  font: 15px/1.5 -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  -webkit-text-size-adjust: 100%;
}
button, input { font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; }
button { cursor: pointer; }
button:hover { background: var(--hover); }
button:disabled { opacity: .4; cursor: default; }
button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
button.icon { border: none; background: none; padding: 4px 8px; font-size: 18px; line-height: 1; }

/* 잠금 화면 */
#lock { max-width: 360px; margin: 0 auto; padding: 18vh 16px 32px; text-align: center; }
#lock h1 { font-size: 22px; margin: 0 0 6px; word-break: keep-all; }
#lock p { color: var(--muted); margin: 0 0 18px; }
#lock form { display: flex; gap: 8px; }
#lock input { flex: 1; min-width: 0; }
#lock-error { color: #d33; min-height: 1.5em; margin-top: 10px; }

/* 리더 */
.topbar {
  position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 6px;
  padding: 6px 10px; padding-top: calc(6px + env(safe-area-inset-top));
  background: var(--bg); border-bottom: 1px solid var(--line);
}
.topbar .title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
#text {
  max-width: var(--width); margin: 0 auto; padding: 24px 20px 32px;
  font-family: var(--reader-font); font-size: var(--font-size); line-height: var(--line-height);
  word-break: keep-all; overflow-wrap: anywhere;
}
#text p { margin: 0 0 .6em; min-height: 1em; }
#text h2 { font-size: 1.15em; margin: 1.2em 0 1em; }
#text h2:first-child { margin-top: 0; }
#text img.cover { display: block; max-width: min(100%, 360px); margin: 0 auto 1.5em; border-radius: 6px; }
.pager { max-width: var(--width); margin: 0 auto; padding: 8px 20px 40px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pager span { color: var(--muted); font-size: 13px; }

/* 목차·설정 패널 */
.panel {
  position: fixed; top: 0; bottom: 0; right: 0; z-index: 20; width: min(340px, 88vw); overflow-y: auto;
  background: var(--panel); border-left: 1px solid var(--line); box-shadow: -6px 0 24px rgba(0,0,0,.15);
  padding: calc(12px + env(safe-area-inset-top)) 14px 24px;
}
.panel h3 { display: flex; justify-content: space-between; align-items: center; margin: 0 0 10px; font-size: 16px; }
#toc-list { list-style: none; margin: 0; padding: 0; }
#toc-list a { display: block; padding: 7px 8px; border-radius: 6px; color: var(--fg); text-decoration: none; font-size: 14px; }
#toc-list a:hover { background: var(--hover); }
#toc-list a.current { color: var(--accent); font-weight: 600; }
.set-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 12px 0; }
.set-row .btns { display: flex; gap: 4px; }
.set-row button.on { border-color: var(--accent); color: var(--accent); }
.note { color: var(--muted); font-size: 12px; margin-top: 18px; }
#scrim { position: fixed; inset: 0; z-index: 15; background: rgba(0,0,0,.25); }

/* 복사·인쇄 방지 */
:root[data-protect] #text { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
@media print { :root[data-protect] body * { display: none !important; } :root[data-protect] body::after { content: "인쇄할 수 없는 문서입니다."; } }
</style>
</head>
<body>
<noscript><p style="padding:24px">이 문서를 읽으려면 브라우저에서 자바스크립트를 켜야 합니다.</p></noscript>

<div id="lock" hidden>
  <h1><!--WN_TITLE--></h1>
  <p id="lock-msg">🔒 비밀번호를 입력해야 읽을 수 있습니다.</p>
  <form id="lock-form">
    <input type="password" id="lock-pw" placeholder="비밀번호" autocomplete="current-password" aria-label="비밀번호">
    <button class="primary" id="lock-btn">열기</button>
  </form>
  <div id="lock-error" role="alert"></div>
</div>

<div id="reader" hidden>
  <header class="topbar">
    <span class="title" id="page-title"></span>
    <button class="icon" id="btn-toc" title="목차" aria-label="목차">☰</button>
    <button class="icon" id="btn-set" title="보기 설정" aria-label="보기 설정">Aa</button>
  </header>
  <article id="text"></article>
  <nav class="pager">
    <button id="btn-prev">← 이전</button>
    <span id="page-no"></span>
    <button id="btn-next">다음 →</button>
  </nav>
</div>

<div id="scrim" hidden></div>
<aside class="panel" id="toc" hidden>
  <h3><span id="toc-title">목차</span><button class="icon" data-close aria-label="닫기">✕</button></h3>
  <ol id="toc-list"></ol>
</aside>
<aside class="panel" id="settings" hidden>
  <h3><span>보기 설정</span><button class="icon" data-close aria-label="닫기">✕</button></h3>
  <div class="set-row"><span>글자 크기</span><span class="btns"><button data-step="fontSize:-1">가−</button><button data-step="fontSize:1">가+</button></span></div>
  <div class="set-row"><span>줄 간격</span><span class="btns"><button data-step="lineHeight:-0.1">−</button><button data-step="lineHeight:0.1">+</button></span></div>
  <div class="set-row"><span>본문 폭</span><span class="btns"><button data-step="width:-60">−</button><button data-step="width:60">+</button></span></div>
  <div class="set-row"><span>글꼴</span><span class="btns"><button data-set="font:serif">명조</button><button data-set="font:sans">고딕</button></span></div>
  <div class="set-row"><span>테마</span><span class="btns"><button data-set="theme:auto">자동</button><button data-set="theme:light">밝게</button><button data-set="theme:sepia">세피아</button><button data-set="theme:dark">어둡게</button></span></div>
  <p class="note">← / → 키로 이전·다음 페이지로 넘어갑니다. 읽던 위치는 이 브라우저에 저장됩니다.</p>
</aside>

<script id="wn-data" type="application/json">/*WN_DATA*/</script>
<script>
(function () {
  'use strict';
  var PAGE_CHARS = 15000, MIN_CHAPTER = 1500;
  var HEADING = /^\s*(?:(?:제\s*)?\d+\s*(?:화|장|권|부|편|회)(?:[\s.:\-)]|$)|(?:chapter|ep\.?|episode)\s*\d+|프롤로그|에필로그|외전|서장|종장|[#＃]\s*\d+|<\s*\d+\s*화?\s*>|\[\s*\d+\s*화?\s*\])/i;
  var DEFAULTS = { fontSize: 18, lineHeight: 1.8, width: 720, font: 'serif', theme: 'auto' };
  var LIMITS = { fontSize: [12, 32], lineHeight: [1.2, 2.6], width: [360, 1200] };
  var $ = function (id) { return document.getElementById(id); };
  var root = document.documentElement;
  var meta = JSON.parse($('wn-data').textContent);
  var docId = meta.iv; // 파일마다 다른 값 → 읽던 위치 저장 키
  var store = {
    get: function (k, d) { try { var v = localStorage.getItem('wnh:' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem('wnh:' + k, JSON.stringify(v)); } catch (e) { /* 저장 불가 환경 */ } },
  };
  var settings = Object.assign({}, DEFAULTS, store.get('settings', {}));
  var book = null, pages = [], cur = 0;

  function b64(s) {
    var bin = atob(s), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  function decrypt(password) {
    var subtle = crypto.subtle;
    var keyP = meta.key
      ? subtle.importKey('raw', b64(meta.key), 'AES-GCM', false, ['decrypt'])
      : subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']).then(function (base) {
        return subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt: b64(meta.salt), iterations: meta.iter },
          base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
      });
    return keyP.then(function (key) {
      return subtle.decrypt({ name: 'AES-GCM', iv: b64(meta.iv) }, key, b64(meta.data)).catch(function () {
        throw new Error('WRONG');
      });
    }).then(function (plain) {
      var stream = new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'));
      return new Response(stream).text();
    }).then(JSON.parse);
  }

  // ---------- 페이지 나누기 ----------
  function buildPages() {
    var multi = book.files.length > 1;
    book.files.forEach(function (f, fi) {
      var lines = f.text.split('\n');
      var start = 0, size = 0, parts = [];
      for (var i = 0; i < lines.length; i++) {
        var h = lines[i].length <= 50 && HEADING.test(lines[i]);
        if (h && i > start && size >= MIN_CHAPTER) { parts.push([start, i]); start = i; size = 0; }
        size += lines[i].length + 1;
        if (size >= PAGE_CHARS) { parts.push([start, i + 1]); start = i + 1; size = 0; }
      }
      if (start < lines.length || !parts.length) parts.push([start, lines.length]);
      parts.forEach(function (p, k) {
        var first = '';
        for (var j = p[0]; j < p[1]; j++) if (lines[j].trim()) { first = lines[j]; break; }
        var heading = first.length <= 50 && HEADING.test(first) ? first.trim() : '';
        var label = multi
          ? (k === 0 ? f.title : heading || f.title + ' (' + (k + 1) + ')')
          : heading || (parts.length > 1 ? (k + 1) + '쪽' : f.title || book.title);
        pages.push({ file: fi, lines: lines.slice(p[0], p[1]), label: label, fileStart: k === 0 });
      });
    });
  }

  // ---------- 화면 ----------
  function render(n, ratio) {
    cur = Math.max(0, Math.min(pages.length - 1, n));
    var page = pages[cur], text = $('text'), frag = document.createDocumentFragment();
    if (cur === 0 && book.cover) {
      var img = document.createElement('img');
      img.className = 'cover'; img.alt = '표지';
      img.src = 'data:' + book.cover.type + ';base64,' + book.cover.data;
      frag.appendChild(img);
    }
    // 여러 파일을 묶은 책: 파일 첫 줄이 화 제목이 아니면 파일 이름을 제목으로 보여 준다
    var firstText = '';
    for (var j = 0; j < page.lines.length; j++) if (page.lines[j].trim()) { firstText = page.lines[j]; break; }
    if (book.files.length > 1 && page.fileStart && !(firstText.length <= 50 && HEADING.test(firstText))) {
      var t = document.createElement('h2'); t.textContent = book.files[page.file].title; frag.appendChild(t);
    }
    page.lines.forEach(function (s) {
      if (!s.trim()) return;
      var h = s.length <= 50 && HEADING.test(s);
      var e = document.createElement(h ? 'h2' : 'p');
      e.textContent = s;
      frag.appendChild(e);
    });
    text.replaceChildren(frag);
    $('page-title').textContent = book.title + (pages.length > 1 ? ' · ' + page.label : '');
    document.title = page.label && pages.length > 1 ? page.label + ' - ' + book.title : book.title;
    $('page-no').textContent = (cur + 1) + ' / ' + pages.length;
    $('btn-prev').disabled = cur === 0;
    $('btn-next').disabled = cur === pages.length - 1;
    var max = document.documentElement.scrollHeight - innerHeight;
    window.scrollTo(0, ratio ? ratio * max : 0);
    save();
    markToc();
  }
  function save() {
    var max = document.documentElement.scrollHeight - innerHeight;
    store.set('pos:' + docId, { page: cur, ratio: max > 0 ? scrollY / max : 0, t: Date.now() });
  }
  function markToc() {
    var links = $('toc-list').querySelectorAll('a');
    for (var i = 0; i < links.length; i++) links[i].classList.toggle('current', i === cur);
  }
  function buildToc() {
    var list = $('toc-list');
    $('toc-title').textContent = book.title;
    pages.forEach(function (p, i) {
      var li = document.createElement('li'), a = document.createElement('a');
      a.href = '#'; a.textContent = p.label;
      a.onclick = function (e) { e.preventDefault(); closePanels(); render(i); };
      li.appendChild(a); list.appendChild(li);
    });
  }
  function applySettings() {
    root.style.setProperty('--font-size', settings.fontSize + 'px');
    root.style.setProperty('--line-height', settings.lineHeight);
    root.style.setProperty('--width', settings.width + 'px');
    root.dataset.font = settings.font;
    root.dataset.theme = settings.theme;
    var on = document.querySelectorAll('[data-set]');
    for (var i = 0; i < on.length; i++) {
      var kv = on[i].dataset.set.split(':');
      on[i].classList.toggle('on', String(settings[kv[0]]) === kv[1]);
    }
  }
  function openPanel(id) { closePanels(); $(id).hidden = false; $('scrim').hidden = false; if (id === 'toc') { var c = $('toc-list').querySelector('.current'); if (c) c.scrollIntoView({ block: 'center' }); } }
  function closePanels() { $('toc').hidden = true; $('settings').hidden = true; $('scrim').hidden = true; }

  function protect() {
    root.dataset.protect = '';
    var inField = function (t) { return t && t.closest && t.closest('input, textarea'); };
    ['copy', 'cut', 'contextmenu', 'selectstart', 'dragstart'].forEach(function (type) {
      document.addEventListener(type, function (e) { if (!inField(e.target)) e.preventDefault(); });
    });
    document.addEventListener('keydown', function (e) {
      if (inField(e.target) || !(e.ctrlKey || e.metaKey)) return;
      if (['a', 'c', 'x', 's', 'p', 'u'].indexOf(e.key.toLowerCase()) >= 0) e.preventDefault();
    });
  }

  function start(b) {
    book = b;
    meta = null; // 복호화가 끝나면 키·암호문을 더 들고 있지 않는다
    if (book.protect) protect();
    buildPages();
    buildToc();
    $('lock').hidden = true;
    $('reader').hidden = false;
    var pos = store.get('pos:' + docId, null);
    render(pos ? pos.page : 0, pos ? pos.ratio : 0);
  }

  // ---------- 이벤트 ----------
  applySettings();
  $('btn-prev').onclick = function () { render(cur - 1); };
  $('btn-next').onclick = function () { render(cur + 1); };
  $('btn-toc').onclick = function () { openPanel('toc'); };
  $('btn-set').onclick = function () { openPanel('settings'); };
  $('scrim').onclick = closePanels;
  document.querySelectorAll('[data-close]').forEach(function (b) { b.onclick = closePanels; });
  document.querySelectorAll('[data-step]').forEach(function (b) {
    b.onclick = function () {
      var kv = b.dataset.step.split(':'), k = kv[0], lim = LIMITS[k];
      settings[k] = Math.round(Math.max(lim[0], Math.min(lim[1], settings[k] + Number(kv[1]))) * 10) / 10;
      store.set('settings', settings); applySettings();
    };
  });
  document.querySelectorAll('[data-set]').forEach(function (b) {
    b.onclick = function () { var kv = b.dataset.set.split(':'); settings[kv[0]] = kv[1]; store.set('settings', settings); applySettings(); };
  });
  document.addEventListener('keydown', function (e) {
    if (!book || (e.target && e.target.closest && e.target.closest('input'))) return;
    if (e.key === 'Escape') closePanels();
    else if (e.key === 'ArrowLeft' && cur > 0) render(cur - 1);
    else if (e.key === 'ArrowRight' && cur < pages.length - 1) render(cur + 1);
  });
  var saveTimer = 0;
  window.addEventListener('scroll', function () { if (book) { clearTimeout(saveTimer); saveTimer = setTimeout(save, 300); } }, { passive: true });

  function fail(msg) { $('lock').hidden = false; $('lock-form').hidden = true; $('lock-msg').textContent = msg; }
  if (!window.crypto || !crypto.subtle || !window.DecompressionStream) {
    fail('이 환경에서는 문서를 열 수 없습니다. Chrome, Edge, Safari, Firefox 최신 버전으로 열어 주세요. '
      + '(파일 미리보기 앱이나 오래된 브라우저에서는 열리지 않습니다.)');
  } else if (meta.key) {
    decrypt('').then(start, function () { fail('문서가 손상되어 열 수 없습니다.'); });
  } else {
    $('lock').hidden = false;
    $('lock-pw').focus();
    $('lock-form').onsubmit = function (e) {
      e.preventDefault();
      var pw = $('lock-pw').value;
      if (!pw) return;
      $('lock-btn').disabled = true;
      $('lock-error').textContent = '여는 중…';
      decrypt(pw).then(start, function (err) {
        $('lock-btn').disabled = false;
        $('lock-error').textContent = err.message === 'WRONG' ? '비밀번호가 올바르지 않습니다.' : '문서를 열 수 없습니다: ' + err.message;
        $('lock-pw').select();
      });
    };
  }
})();
</script>
</body>
</html>
